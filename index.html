<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <title>速成查碼 · Quick lookup</title>
  <meta name="description" content="輸入中文，睇佢嘅速成碼。Type any Chinese word and see how to type it in Quick (速成)." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23fff'%3E速%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Sans+HK:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>try { const t = JSON.parse(localStorage.getItem('quick:theme')); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <!-- Language: the saved choice, else the browser's. Set before paint so the other language never flashes -->
  <script>{ let l; try { l = JSON.parse(localStorage.getItem('quick:lang')); } catch {} l = l || (/^zh/i.test(navigator.language) ? 'zh' : 'en'); document.documentElement.dataset.lang = l; document.documentElement.lang = l === 'zh' ? 'zh-Hant' : 'en'; }</script>
</head>
<body>
  <div id="layer" class="layer" aria-hidden="true"></div>

  <header class="brand">速成查碼 <span>Quick lookup</span></header>

  <main class="finder">
    <label for="q"><span class="zh" lang="zh-Hant">想查咩？</span><span class="en" lang="en">Look up a word</span></label>
    <div class="box">
      <input id="q" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>
    <div id="result" class="result" aria-live="polite"></div>
  </main>

  <div id="practice" class="practice" hidden role="dialog" aria-modal="true" aria-labelledby="practice-title">
    <div class="sheet">
      <button type="button" class="close" aria-label="Close · 關閉">×</button>
      <h2 id="practice-title"><span class="pch"></span> <span class="zh" lang="zh-Hant">練筆順</span><span class="en" lang="en">Stroke practice</span></h2>
      <div class="boards">
        <figure><div class="board guide"></div><figcaption><span class="zh" lang="zh-Hant">筆順</span><span class="en" lang="en">Stroke order</span></figcaption></figure>
        <figure><div class="board pad"></div><figcaption><span class="zh" lang="zh-Hant">跟住寫</span><span class="en" lang="en">Your turn: draw each stroke</span></figcaption></figure>
      </div>
      <p class="status" aria-live="polite"></p>
      <div class="actions">
        <button type="button" data-act="watch"><span class="zh" lang="zh-Hant">示範</span><span class="en" lang="en">Watch</span></button>
        <button type="button" data-act="again"><span class="zh" lang="zh-Hant">再寫</span><span class="en" lang="en">Start over</span></button>
      </div>
      <div class="picker"></div>
      <p class="note"><span class="zh" lang="zh-Hant">筆順資料來自 Make Me a Hanzi，以內地標準為主，少數字同香港寫法唔同。</span><span class="en" lang="en">Stroke data from Make Me a Hanzi. It follows the mainland standard, so a few characters differ from how Hong Kong writes them.</span></p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="cangjie.js"></script>
  <script src="toolbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
  <script src="app.js"></script>
  <script src="practice.js"></script>
</body>
</html>
